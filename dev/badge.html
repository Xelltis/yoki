<style>
  /* 開発サーバー: シートとログアウトは無い */
  #sheetLink, #stSheetLink, #logoutBtn, #stLogout { display: none !important; }
  .dev-badge { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: 12px; z-index: 60; display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 8px 6px 14px; border-radius: 999px; background: var(--toast); color: var(--toast-text); font-size: 12px; font-weight: 600; box-shadow: var(--shadow-lg); }
  .dev-badge button { font: inherit; font-size: 12px; height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--toast-text) 16%, transparent); color: inherit; cursor: pointer; }
  @media (max-width: 600px) { .dev-badge { bottom: calc(var(--nav-h, 64px) + 12px + env(safe-area-inset-bottom)); } }
</style>
<div class="dev-badge" id="devBadge" role="note">サンプルデータで動作中・操作は保存されません<button type="button" id="devReset">最初に戻す</button></div>
<script>
  (function () {
    if (new URLSearchParams(location.search).has('clean')) document.getElementById('devBadge').remove();
    else document.getElementById('devReset').onclick = function () { try { localStorage.removeItem('taku.cache'); } catch (e) {} location.reload(); };
  })();
</script>
