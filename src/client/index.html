<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoki</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2d2afe">
<!-- リンクを貼ったときの見た目（OGP）。入口やグループの画面などのリンクは、Workerがこのタグを、公開のアドレスを入れた道ごとの文に
     書き換える（src/worker/routes/og.tsと同じ文）。組み立てのときには公開のアドレスが分からないので、ここはアドレスを省いた形 -->
<meta name="description" content="TRPGの卓の予定を、Discordサーバーの仲間と管理するWebアプリ。みんなの都合・募集・日程調整・Discordへの知らせを1か所で。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yoki">
<meta property="og:title" content="Yoki">
<meta property="og:description" content="TRPGの卓の予定を、Discordサーバーの仲間と管理するWebアプリ。みんなの都合・募集・日程調整・Discordへの知らせを1か所で。">
<meta property="og:url" content="/">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="900">
<meta name="twitter:card" content="summary_large_image">
<!-- アイコンはSVGでJSに入っている（src/client/ui/icons.ts）。Google Fontsから読むのは文字だけ -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 文字はNoto Sans JP（太さは400〜700）。どの端末でも同じ見た目にする。読めるまでは端末の字で出す -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400..700&display=swap">
<script>
  // この端末で選んだ見た目（ライト／ダーク）と文字の大きさを、描く前に当てる。無ければOSの設定（prefers-color-scheme）に任せる
  (function () {
    try { var t = localStorage.getItem('taku.theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    try {
      var f = localStorage.getItem('taku.font');
      if (f === 'm' || f === 'l') { document.documentElement.setAttribute('data-font', f); document.documentElement.style.setProperty('--zoom', f === 'l' ? '1.25' : '1.12'); }
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/main.tsx"></script>
</body>
</html>
