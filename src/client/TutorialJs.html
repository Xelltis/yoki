<script>
  (function () {
    var WD = ['日', '月', '火', '水', '木', '金', '土'];
    var $ = function (id) { return document.getElementById(id); };
    function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
    function md(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
    function mdw(d) { return md(d) + '（' + WD[d.getDay()] + '）'; }
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var monday = addDays(today, ((8 - today.getDay()) % 7) || 7);   // 次の月曜。例の日付はいつ開いても先の日になる

    /* ---- 冒頭の予定表: あなたの行を押すと 空 → △ → × → 空 ---- */
    var days = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return addDays(monday, i); });
    var people = [
      { name: 'アリス', marks: ['', '×', '', '△', '', '', '×'] },
      { name: 'ボブ', marks: ['△', '', '', '', '', '×', ''] },
      { name: 'カレン', marks: ['', '', '×', '', '', '', ''] },
      { name: 'あなた', marks: ['', '', '', '', '', '', ''], me: true }
    ];
    var NEXT = { '': '△', '△': '×', '×': '' };
    var WORD = { '': '空欄（参加できる）', '△': '△（調整すれば行ける）', '×': '×（行けない）' };
    function dayState(i) {
      var ms = people.map(function (p) { return p.marks[i]; });
      return ms.indexOf('×') >= 0 ? 'ng' : ms.indexOf('△') >= 0 ? 'soft' : 'ok';
    }
    function renderHero() {
      $('heroRange').textContent = md(days[0]) + '〜' + md(days[6]);
      var states = days.map(function (d, i) { return dayState(i); });
      var h = '<thead><tr><th scope="col"><span class="vh">名前</span></th>' + days.map(function (d, i) {
        var dow = d.getDay();
        return '<th scope="col" class="' + (dow === 0 ? 'sun ' : dow === 6 ? 'sat ' : '') + (states[i] === 'ok' ? 'ok' : '') + '"><span class="d">' + md(d) + '</span><span class="w">' + WD[dow] + '</span></th>';
      }).join('') + '</tr></thead><tbody>';
      people.forEach(function (p, pi) {
        h += '<tr' + (p.me ? ' class="me"' : '') + '><th scope="row" class="name">' + p.name + '</th>';
        p.marks.forEach(function (m, i) {
          var cls = m === '△' ? 'm-soft' : m === '×' ? 'm-ng' : '';
          if (p.me) h += '<td class="' + cls + '"><button type="button" class="mk" data-i="' + i + '" aria-label="' + mdw(days[i]) + ' あなたの予定は' + WORD[m] + '。押すと' + WORD[NEXT[m]] + '">' + (m || '<span class="hint">·</span>') + '</button></td>';
          else h += '<td class="' + cls + '">' + m + '</td>';
        });
        h += '</tr>';
      });
      h += '<tr class="sum"><th scope="row" class="name">全員</th>' + states.map(function (st) {
        return '<td class="' + (st === 'ok' ? 'ok' : st) + '">' + (st === 'ok' ? '◎' : st === 'soft' ? '△' : '—') + '</td>';
      }).join('') + '</tr></tbody>';
      $('heroGrid').innerHTML = h;
      var ok = days.filter(function (d, i) { return states[i] === 'ok'; });
      $('heroSay').textContent = ok.length ? '全員が空いている日: ' + ok.map(mdw).join('、') : '全員が空いている日はありません';
    }
    $('heroGrid').addEventListener('click', function (ev) {
      var b = ev.target.closest('.mk'); if (!b) return;
      var i = +b.getAttribute('data-i'), me = people[3];
      me.marks[i] = NEXT[me.marks[i]];
      renderHero();
      var nb = document.querySelector('#heroGrid .mk[data-i="' + i + '"]'); if (nb && ev.detail === 0) nb.focus();
    });
    renderHero();

    /* ---- 募集: 参加希望・興味あり ---- */
    var join = '';
    function renderJoin() {
      var want = ['ダン'].concat(join === 'want' ? ['あなた'] : []), interest = join === 'interest' ? ['あなた'] : [];
      $('joinWant').innerHTML = want.map(function (n) { return n === 'あなた' ? '<b style="color: var(--accent-text)">あなた</b>' : n; }).join('、');
      $('joinInterest').innerHTML = interest.length ? '<b style="color: var(--accent-text)">あなた</b>' : '<span style="color: var(--muted)">まだいません</span>';
      $('joinWantBtn').setAttribute('aria-pressed', String(join === 'want'));
      $('joinInterestBtn').setAttribute('aria-pressed', String(join === 'interest'));
      $('joinClear').hidden = !join;
    }
    function setJoin(v) {
      join = v; renderJoin();
      $('joinSay').innerHTML = v === 'want' ? '<b>参加希望にしました。</b>状態が「開催」になると、そのまま参加者に入ります。'
        : v === 'interest' ? '<b>興味ありにしました。</b>GM から声がかかったら、参加希望に切り替えれば返事になります。'
        : '取り消しました。Discord には何も流れていません。';
    }
    $('joinWantBtn').onclick = function () { setJoin(join === 'want' ? '' : 'want'); };
    $('joinInterestBtn').onclick = function () { setJoin(join === 'interest' ? '' : 'interest'); };
    $('joinClear').onclick = function () { setJoin(''); };
    renderJoin();

    /* ---- 日程調整: 全員が答えたら GM に知らせが届く ---- */
    var cands = [addDays(monday, 11), addDays(monday, 12), addDays(monday, 13)];
    var voters = ['ダン', 'アリス', 'あなた'];
    var votes, decided;
    function resetVotes() {
      votes = [{ 'ダン': '◯', 'アリス': '◯' }, { 'ダン': '◯', 'アリス': '◯' }, { 'ダン': '◯', 'アリス': '×' }];
      decided = -1;
    }
    function renderVote() {
      var h = '';
      cands.forEach(function (d, i) {
        var v = votes[i], ok = voters.filter(function (n) { return v[n] === '◯'; }), ng = voters.filter(function (n) { return v[n] === '×'; }), no = voters.filter(function (n) { return !v[n]; });
        var my = v['あなた'] || '', off = false;
        h += '<div class="poll-row' + (ok.length === voters.length ? ' all' : '') + '"><span class="poll-date">' + mdw(d) + '<span class="cnt">◯ ' + ok.length + '/' + voters.length + '</span></span>' +
          '<span class="row-btns" style="margin: 0"><button type="button" class="pill-btn vote' + (my === '◯' ? ' on-ok' : '') + '" data-i="' + i + '" data-v="◯" aria-pressed="' + (my === '◯') + '" aria-label="' + mdw(d) + ' は ◯"' + (off ? ' disabled' : '') + '>◯</button>' +
          '<button type="button" class="pill-btn vote' + (my === '×' ? ' on-ng' : '') + '" data-i="' + i + '" data-v="×" aria-pressed="' + (my === '×') + '" aria-label="' + mdw(d) + ' は ×"' + (off ? ' disabled' : '') + '>×</button></span>' +
          '<span class="poll-names">' + [ok.length ? '◯ ' + ok.join('、') : '', ng.length ? '× ' + ng.join('、') : '', no.length ? '未回答 ' + no.join('、') : ''].filter(Boolean).join('　') + '</span></div>';
      });
      $('votePoll').innerHTML = h;
      $('voteDecided').hidden = decided < 0;
      $('voteStatus').textContent = '調整中';
      $('voteStatus').className = 'status';
      if (decided >= 0) $('voteDecidedText').textContent = '全員の回答がそろいました。GM のダンに知らせが届き、ダンが開催日を選びます';
    }
    $('votePoll').addEventListener('click', function (ev) {
      var b = ev.target.closest('.vote'); if (!b) return;
      var i = +b.getAttribute('data-i'), v = b.getAttribute('data-v');
      if (votes[i]['あなた'] === v) delete votes[i]['あなた']; else votes[i]['あなた'] = v;
      var was = decided;
      decided = votes.every(function (v) { return voters.every(function (n) { return !!v[n]; }); }) ? 0 : -1;
      renderVote();
      $('voteSay').textContent = decided >= 0 && was < 0 ? 'あなたの回答で全員がそろいました。GM に Discord で知らせが届きます。'
        : votes[i]['あなた'] ? mdw(cands[i]) + ' を ' + votes[i]['あなた'] + ' にしました。' : mdw(cands[i]) + ' の回答を取り消しました。';
      var nb = document.querySelector('#votePoll .vote[data-i="' + i + '"][data-v="' + v + '"]'); if (nb && !nb.disabled && ev.detail === 0) nb.focus();
    });
    $('voteReset').onclick = function () { resetVotes(); renderVote(); $('voteSay').textContent = '最初の状態に戻しました。'; };
    resetVotes(); renderVote();

    /* ---- 卓を登録: 選んだ日の卓になる ---- */
    var regSel = -1;
    function renderReg() {
      $('regWeek').innerHTML = days.map(function (d, i) {
        var dow = d.getDay();
        return '<button type="button" class="day' + (dow === 0 ? ' sun' : dow === 6 ? ' sat' : '') + '" data-i="' + i + '" aria-pressed="' + (regSel === i) + '"><span class="w">' + WD[dow] + '</span><span class="d">' + md(d) + '</span></button>';
      }).join('');
      $('regBtnLbl').textContent = regSel >= 0 ? md(days[regSel]) + ' に卓を登録' : '卓を登録';
    }
    $('regWeek').addEventListener('click', function (ev) {
      var b = ev.target.closest('.day'); if (!b) return;
      var i = +b.getAttribute('data-i');
      regSel = regSel === i ? -1 : i;
      $('regPeek').hidden = true;
      renderReg();
      var nb = document.querySelector('#regWeek .day[data-i="' + i + '"]'); if (nb && ev.detail === 0) nb.focus();
      $('regSay').textContent = regSel >= 0 ? mdw(days[regSel]) + ' を選びました。ボタンの名前が変わりました。' : '選択を外しました。';
    });
    $('regBtn').onclick = function () {
      $('regPeek').hidden = false;
      var d = regSel >= 0 ? days[regSel] : null;
      $('regDate').innerHTML = d ? d.getFullYear() + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2) : '<span class="empty">空のまま</span>';
      $('regSay').textContent = d ? '登録の窓が開き、開催日に ' + mdw(d) + ' が入りました。' : '日を選ばずに押したので、開催日は空のまま開きました。';
    };
    renderReg();

    /* ---- 目次: いま読んでいる章に印 ---- */
    if ('IntersectionObserver' in window) {
      var links = {};
      Array.prototype.forEach.call(document.querySelectorAll('.index a'), function (a) { links[a.getAttribute('href').slice(1)] = a; });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          Object.keys(links).forEach(function (k) { links[k].setAttribute('aria-current', String(k === e.target.id)); });
          var a = links[e.target.id];
          if (a && a.parentNode.scrollWidth > a.parentNode.clientWidth) a.parentNode.scrollTo({ left: a.offsetLeft - 16, behavior: 'auto' });
        });
      }, { rootMargin: '-35% 0px -60% 0px' });
      Array.prototype.forEach.call(document.querySelectorAll('.chapter'), function (s) { io.observe(s); });
    }

    /* ---- アプリへのリンク。ウェブアプリから開いたときだけ URL が渡る（server/WebApp.js の doGet） ---- */
    function showAppLinks() {
      var url = window.APP_URL;
      if (!url) return;
      Array.prototype.forEach.call(document.querySelectorAll('[data-app-link]'), function (a) { a.href = url; a.hidden = false; });
    }
    if (document.readyState === 'complete') showAppLinks(); else window.addEventListener('load', showAppLinks);
  })();
</script>
