<script>
  var D = null;
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var view = { y: 0, m: 0 };
  var selDay = '';
  var selected = {};
  var notifyRes = {};
  var sync = { inflight: null, pending: 0, epoch: 0, sig: '', last: 0, failed: false, stale: false };   // 読み込みと書き込みの状態
  var drafts = { member: false, settings: false };   // 保存前の書きかけ。読み込み直しても上書きしない
  var $ = function (id) { return document.getElementById(id); };
  /* Material Icons の 1 つ。飾りなので読み上げない */
  function mi(name, cls) { return '<span class="material-icons' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + name + '</span>'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return ('0' + n).slice(-2); }
  function ymdOf(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function parseYmd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDaysYmd(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymdOf(d.getFullYear(), d.getMonth(), d.getDate()); }
  function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
  function fmtJa(s) { var d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; }
  function timeRange(s) { if (!s.start && !s.end) return '時間未定'; return (s.start || '？') + '〜' + (s.end || ''); }
  /* 状態。募集 → 調整中 → 開催 → 終了、中止は別 */
  var STATUS_ACTIVE = ['募集', '調整中', '開催'], STATUS_DATED = ['開催'], STATUS_PROMOTE = ['調整中', '開催'];
  function isDated(s) { return STATUS_DATED.indexOf(s.status) >= 0; }
  function isRecruit(s) { return s.status === '募集'; }
  function isAdjusting(s) { return s.status === '調整中'; }
  /* 卓の状態ごとのアイコン。カレンダーの札と凡例で使う */
  var STATUS_ICON = { '開催': 'event', '募集': 'campaign', '調整中': 'edit_calendar', '終了': 'task_alt', '中止': 'block' };
  var CAL_LEGEND = [['event', '開催'], ['play_circle', '今日'], ['campaign', '募集'], ['edit_calendar', '調整期間'], ['how_to_vote', '候補日', 'cand'], ['task_alt', '終了'], ['block', '中止'], ['sticky_note_2', 'メモ']];
  /* 日程調整 */
  function hasPoll(s) { return isAdjusting(s) && !!(s.candidates && s.candidates.length); }
  function pollOk(s, k) { var v = (s.votes || {})[k] || {}; return peopleOf(s).filter(function (n) { return v[n] === '◯'; }); }
  function pollPending(s) {
    var vs = s.votes || {}, fut = (s.candidates || []).filter(function (k) { return k >= D.today; });
    return peopleOf(s).filter(function (n) { return fut.some(function (k) { return !(vs[k] && vs[k][n]); }); });
  }
  function winLabel(from, to) { return from && to ? fmtJa(from) + '〜' + fmtJa(to) : ''; }
  /* 調整中の卓を日ごとに。日程調整中なら候補日、そうでなければ候補の期間。カレンダーと都合表の印に使う */
  function windowByDay() {
    var out = {};
    D.sessions.forEach(function (s) {
      if (!isAdjusting(s)) return;
      if (hasPoll(s)) { s.candidates.forEach(function (k) { (out[k] = out[k] || []).push(s); }); return; }
      if (!s.windowFrom || !s.windowTo) return;
      for (var d = s.windowFrom, i = 0; d <= s.windowTo && i < 120; d = addDaysYmd(d, 1), i++) (out[d] = out[d] || []).push(s);
    });
    return out;
  }
  /* 募集の卓の期間。「10/3（金）〜10/17（金） に開催予定」 */
  function periodOfSession(s) { return s.windowLabel ? s.windowLabel + ' に開催予定' : '時期未定'; }
  /* 日本の祝日。振替休日と国民の休日を含む。春分・秋分は 1980〜2099 年の近似式 */
  var HOLIDAYS = {};
  function jpHolidays(year) {
    if (HOLIDAYS[year]) return HOLIDAYS[year];
    var base = {};
    var add = function (m, d, name) { base[ymdOf(year, m - 1, d)] = name; };
    add(1, 1, '元日'); add(2, 11, '建国記念の日'); add(2, 23, '天皇誕生日'); add(4, 29, '昭和の日');
    add(5, 3, '憲法記念日'); add(5, 4, 'みどりの日'); add(5, 5, 'こどもの日'); add(8, 11, '山の日'); add(11, 3, '文化の日'); add(11, 23, '勤労感謝の日');
    var nthMon = function (m, n) { var first = new Date(year, m - 1, 1).getDay(); return 1 + ((8 - first) % 7) + (n - 1) * 7; };
    add(1, nthMon(1, 2), '成人の日'); add(7, nthMon(7, 3), '海の日'); add(9, nthMon(9, 3), '敬老の日'); add(10, nthMon(10, 2), 'スポーツの日');
    add(3, Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)), '春分の日');
    add(9, Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)), '秋分の日');
    var out = {}; Object.keys(base).forEach(function (k) { out[k] = base[k]; });
    Object.keys(base).forEach(function (k) {
      var d = parseYmd(k); if (d.getDay() !== 0) return;
      var x = new Date(d.getTime()); do { x.setDate(x.getDate() + 1); } while (base[ymdOf(x.getFullYear(), x.getMonth(), x.getDate())]);
      var kk = ymdOf(x.getFullYear(), x.getMonth(), x.getDate()); if (!out[kk]) out[kk] = '振替休日';
    });
    for (var d = new Date(year, 0, 1); d.getFullYear() === year; d.setDate(d.getDate() + 1)) {
      var k = ymdOf(year, d.getMonth(), d.getDate());
      if (out[k] || d.getDay() === 0) continue;
      if (base[addDaysYmd(k, -1)] && base[addDaysYmd(k, 1)]) out[k] = '国民の休日';
    }
    HOLIDAYS[year] = out; return out;
  }
  function holidayName(key) { return jpHolidays(+key.slice(0, 4))[key] || ''; }
  function store(k, v) { try { localStorage.setItem('taku.' + k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem('taku.' + k) || ''; } catch (e) { return ''; } }
  function toast(t) { var el = $('toast'); el.textContent = t; el.className = 'show'; clearTimeout(el._t); el._t = setTimeout(function () { el.className = ''; }, t && t.length > 40 ? 5000 : 2500); }
  function me() { return $('me').value; }
  /* 「あなた」が未選択のとき。吹き出しで知らせ、上の選ぶ欄にフォーカスして目立たせる */
  function needMe() {
    toast('上の「あなた」で自分を選んでください');
    var sel = $('me'); sel.classList.add('attn'); sel.focus({ preventScroll: true });
    clearTimeout(sel._attn); sel._attn = setTimeout(function () { sel.classList.remove('attn'); }, 2400);
  }
  function peopleOf(s) { var out = []; if (s.gm) out.push(s.gm); s.members.forEach(function (n) { if (out.indexOf(n) < 0) out.push(n); }); return out; }
  function isActive(s) { return STATUS_ACTIVE.indexOf(s.status) >= 0; }
  /* 都合を見る相手。GM と参加者に、募集中なら参加希望の人も加える */
  function candidatesOf(s) { var out = peopleOf(s); if (isRecruit(s)) (s.want || []).forEach(function (n) { if (out.indexOf(n) < 0) out.push(n); }); return out; }
  function active() { return D.sessions.filter(isActive); }
  function byId(id) { return D.sessions.filter(function (x) { return x.id === id; })[0] || null; }
  function sortSessions(list) {
    return list.slice().sort(function (a, b) {
      if (!!a.date !== !!b.date) return a.date ? -1 : 1;
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      if (!a.date && !b.date) { var ka = a.windowKey || '9999', kb = b.windowKey || '9999'; if (ka !== kb) return ka < kb ? -1 : 1; }
      if (a.start !== b.start) return (a.start || '99') < (b.start || '99') ? -1 : 1;
      return a.name < b.name ? -1 : 1;
    });
  }
  function sortedActive() { return sortSessions(active()); }
  /**
   * 列の並び。稼働中の卓に入っている人ほど左へ寄せる。
   * 卓の数（GM も参加も 1 件と数える）が多い順、同数なら GM の多い順、それも同じならメンバーの登録順
   */
  function memberOrder(names) {
    if (!$('sortByLoad').checked) return names;
    var act = active(), score = {};
    names.forEach(function (n, i) {
      var gm = 0, pl = 0;
      act.forEach(function (s) { if (s.gm === n) gm++; else if (s.members.indexOf(n) >= 0) pl++; });
      score[n] = { total: gm + pl, gm: gm, i: i };
    });
    return names.slice().sort(function (a, b) {
      var x = score[a], y = score[b];
      if (x.total !== y.total) return y.total - x.total;
      if (x.gm !== y.gm) return y.gm - x.gm;
      return x.i - y.i;
    });
  }
  /* 使い方のページ（…/exec?page=tutorial）。ウェブアプリの URL が分かったときだけリンクを出す */
  function setHelpLinks(appUrl) {
    var url = appUrl ? appUrl + '?page=tutorial' : '';
    ['helpLink', 'helpLinkM', 'stHelpLink', 'loginHelp'].forEach(function (id) { $(id).href = url || '#'; });
    $('helpLink').hidden = !url; $('helpLinkM').hidden = !url; $('stHelpLink').hidden = !url; $('loginHelpWrap').hidden = !url;
  }
  /* ---- 合言葉 ---- */
  function token() { return load('token'); }
  function adminToken() { return load('adminToken'); }
  function isAdmin() { return !D || D.isAdmin !== false; }
  var API_FUNCS = ['getConsoleData', 'login', 'setInitialPassword', 'changePassword', 'sendDiscordStep', 'setDayNote', 'setInterest', 'bulkUpdateSessions',
    'setAvailability', 'setAvailabilityBulk', 'setAvailNote', 'saveSession', 'deleteSession', 'saveMember', 'deleteMember', 'saveConsoleSettings', 'setAutoNotify', 'saveSeriesNotify', 'renameSpreadsheet', 'testDiscordConsole', 'startPoll', 'setPollVote', 'setPollVoteAll', 'cancelPoll', 'decidePoll',
    'loginAdmin', 'setAdminPassword', 'removeAdmin'];
  /**
   * google.script.run の代わり。呼ぶときにブラウザが覚えている証を添える。
   * サーバーが「AUTH:」で断ったら（合言葉が変わった、まだ入れていない）、証を捨ててログインの窓を出す
   */
  var API_WAIT = 45000;   // サーバーの返事を待つ上限（ミリ秒）
  function api() {
    var okF = null, ngF = null;
    var o = { withSuccessHandler: function (f) { okF = f; return o; }, withFailureHandler: function (f) { ngF = f; return o; } };
    API_FUNCS.forEach(function (name) {
      o[name] = function () {
        var args = Array.prototype.slice.call(arguments);
        if (name === 'setAvailability') { args[3] = token(); args[4] = args[4] || me(); args[5] = adminToken(); }
        else { var f = {}; var src = args[0] || {}; for (var k in src) f[k] = src[k]; f.token = token(); f.adminToken = adminToken(); if (f.me === undefined) f.me = me(); args[0] = f; }
        // 書き込みは数えておく。返事待ちのあいだは自動更新をせず、古いデータで描き戻さない
        var write = name !== 'getConsoleData';
        if (write) { sync.pending++; sync.epoch++; }
        var settle = function () { if (write) sync.pending = Math.max(0, sync.pending - 1); };
        // 返事が返ってこないまま終わると、押せなくしたボタンが戻らない。API_WAIT で打ち切って失敗として返す
        var over = false, timer = setTimeout(function () {
          over = true; settle();
          if (ngF) ngF({ message: 'サーバーから返事がありません。通信を確かめて、もう一度お試しください。' });
          afterWrites();
        }, API_WAIT);
        var gs = google.script.run;
        var r = gs.withSuccessHandler(function (res) { if (over) return; clearTimeout(timer); settle(); if (okF) okF(res); afterWrites(); })
          .withFailureHandler(function (e) {
            if (over) return;
            clearTimeout(timer); settle();
            var auth = /^AUTH:/.test(e && e.message || '');
            if (auth) { store('token', ''); lockScreen('合言葉が変わったか、まだ入れていません。入れ直してください。'); }
            var adm = /^ADMIN:/.test(e && e.message || '');
            if (adm) {
              store('adminToken', '');
              var retry = { fn: name, args: args, ok: okF, ng: ngF };
              askAdmin(String(e.message).replace(/^ADMIN:\s*/, ''), function () { callApi(retry); });
              return;
            }
            if (ngF) ngF(auth ? { message: '合言葉を入れ直してください。' } : e);
            afterWrites();
          });
        r[name].apply(r, args);
      };
    });
    return o;
  }
  var loginMode = 'login';
  function openLogin(mode, msg) {
    loginMode = mode;
    setHelpLinks(load('appUrl'));
    $('loginModal').hidden = false;
    $('loginTitle').textContent = mode === 'init' ? '最初の合言葉を決める' : 'ログイン';
    $('loginHint').textContent = mode === 'init'
      ? 'この画面を開く人の全員で使う合言葉です。8 文字以上。あとから設定タブで変えられます。'
      : '一度入れれば、このブラウザではログアウトするか合言葉が変わるまで求めません。';
    $('lgPassLabel').textContent = mode === 'init' ? '新しい合言葉' : '合言葉';
    $('lgConfirmWrap').hidden = mode !== 'init';
    $('lgOk').textContent = mode === 'init' ? '決める' : 'ログイン';
    $('loginMsg').textContent = msg || '';
    $('lgPass').value = ''; $('lgConfirm').value = '';
    $('lgPass').focus();
  }
  /* 画面を隠してログインを求める。データは消す */
  /* 管理者の合言葉を聞く。通ったら done() を呼ぶ */
  var adminAfter = null;
  function askAdmin(why, done) {
    adminAfter = done || null;
    $('adminHint').textContent = why || 'この操作は管理者だけができます。';
    $('adPass').value = '';
    $('adminMsg').textContent = '';
    $('adminMsg').className = '';
    $('adminModal').hidden = false;
    setTimeout(function () { $('adPass').focus(); }, 30);
  }
  function closeAdmin() { $('adminModal').hidden = true; adminAfter = null; }
  $('adCancel').onclick = closeAdmin;
  $('adminModal').addEventListener('click', function (ev) { if (ev.target === $('adminModal')) closeAdmin(); });
  $('adminForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = $('adPass').value;
    if (!pw.trim()) { $('adminMsg').textContent = '管理者の合言葉を入れてください。'; $('adminMsg').className = 'err'; return; }
    $('adOk').disabled = true;
    $('adminMsg').textContent = '確かめています…';
    $('adminMsg').className = '';
    var after = adminAfter;
    api().withSuccessHandler(function (res) {
      $('adOk').disabled = false;
      store('adminToken', res.adminToken);
      closeAdmin();
      useData(res);
      toast(res.message);
      if (after) after();
    }).withFailureHandler(function (e) {
      $('adOk').disabled = false;
      $('adminMsg').textContent = e.message;
      $('adminMsg').className = 'err';
    }).loginAdmin({ password: pw, me: me() });
  });
  /* 断られた呼び出しを、管理者になったあとでやり直す */
  function callApi(r) {
    var o = api();
    if (r.ok) o = o.withSuccessHandler(r.ok);
    if (r.ng) o = o.withFailureHandler(r.ng);
    o[r.fn].apply(o, r.args);
  }
  function lockScreen(msg) {
    D = null;
    var secs = document.querySelectorAll('main > section');
    for (var i = 0; i < secs.length; i++) secs[i].hidden = true;
    $('loading').hidden = false; loadingMsg('ログインすると表示されます。');
    $('logoutBtn').hidden = true; $('memoModal').hidden = true; $('askModal').hidden = true; $('formModal').hidden = true; $('pollModal').hidden = true;
    confirmCb = null; $('confirmModal').hidden = true;
    clearCache();
    if (msg === undefined && !$('loginModal').hidden) return;   // もう窓が出ている。理由の文は消さない
    openLogin('login', msg);
  }
  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = $('lgPass').value;
    if (!pw.trim()) { $('loginMsg').textContent = '合言葉を入れてください。'; return; }
    $('lgOk').disabled = true; $('loginMsg').textContent = '確かめています…';
    var r = api().withSuccessHandler(function (res) { $('lgOk').disabled = false; store('token', res.token); $('loginModal').hidden = true; $('loading').innerHTML = SKELETON; reload(false); })
      .withFailureHandler(function (e) { $('lgOk').disabled = false; $('loginMsg').textContent = e.message; });
    r[loginMode === 'init' ? 'setInitialPassword' : 'login']({ password: pw, confirm: $('lgConfirm').value, me: me() });
  });
  function logout() {
    askConfirm({ title: 'ログアウトしますか？', message: 'このブラウザが覚えている合言葉を消します（管理者の証も消えます）。次に開くときにまた入れます。', ok: 'ログアウト', danger: true },
      function () { store('token', ''); store('adminToken', ''); lockScreen('ログアウトしました。'); });
  }
  $('logoutBtn').onclick = logout;
  $('stLogout').onclick = logout;

  function refetch(after) {
    var ep = sync.epoch;
    api().withSuccessHandler(function (d) {
      if (d.needLogin) { lockScreen(); return; }
      if (ep !== sync.epoch) { sync.stale = true; return; }   // 読んでいるあいだに別の書き込みが始まった。その返事のあとで読み直す
      applyData(d); if (after) after();
    }).withFailureHandler(function (e) { toast('読み込めませんでした: ' + e.message); }).getConsoleData();
  }
  /* 書き込みの返事には最新のデータが同梱されている。あればそれを使い、2 往復目をしない */
  function useData(res, after) {
    if (res && res.data) {
      // ほかにも返事待ちの書き込みがあるなら、まだ描かない（押した瞬間の表示が一度戻るのを防ぐ）。最後の返事か読み直しで描く
      if (sync.pending > 0) { sync.stale = true; return; }
      applyData(res.data); if (after) after();
    }
    else refetch(after);
  }
  /**
   * Discord へ送る。送り先が何か所かあれば（シリーズのチャンネルと基本のチャンネル）、1 か所ずつ順に送る。
   * 1 か所ごとにサーバーへ 1 回ずつ頼み、429 や 5xx なら秒を数えながら送り直す。
   * status(text) に進み具合が届く。done(ok, r) で終わる。ok は、すべての送り先に届いたとき true
   */
  function discordSend(form, status, done) {
    var attempt = 1, maxTries = 3, to = 0, count = 1, labels = [], sent = [], failed = [], got = {};
    var KEEP = ['data', 'asked', 'notified'];   // 届いた返事に付いてくるもの。最後の送り先で失敗しても渡す
    function set(t) { if (typeof status === 'function') status(t); }
    function where() { return count > 1 ? '［' + (to + 1) + '/' + count + (labels[to] ? ' ' + labels[to] : '') + '］' : ''; }
    function finish(r) {
      KEEP.forEach(function (k) { if (got[k] !== undefined && r[k] === undefined) r[k] = got[k]; });
      r.sent = sent; r.failed = failed; r.partial = sent.length > 0 && failed.length > 0;
      if (count > 1) {
        if (!failed.length) set('Discord の ' + count + ' か所に送りました（' + sent.join('、') + '）。');
        else set((sent.length ? sent.join('、') + ' には届きました。' : '') + failed.map(function (f) { return f.label + ' には届きませんでした（' + (f.reason ? f.reason.label : f.text) + '）'; }).join('。') + '。');
      }
      done(!failed.length, r);
    }
    function next(r) {
      if (to + 1 < count) { to++; attempt = 1; step(); }
      else finish(r);
    }
    function step() {
      set(where() + 'Discord に送信中…（' + attempt + ' 回目／最大 ' + maxTries + ' 回）');
      form.attempt = attempt; form.to = to;
      api().withSuccessHandler(function (r) {
        if (r.maxTries) maxTries = r.maxTries;
        if (r.targetCount) count = r.targetCount;
        if (r.targetLabel) labels[to] = r.targetLabel;
        var name = labels[to] || 'Discord';
        if (r.ok) {
          sent.push(name);
          KEEP.forEach(function (k) { if (r[k] !== undefined) got[k] = r[k]; });
          set(where() + 'Discord に送りました' + (attempt > 1 ? '（' + attempt + ' 回目で成功）' : '') + '。');
          next(r); return;
        }
        var rs = r.reason || { label: '原因不明', text: '', advice: '', toolFault: true };
        if (!r.retryable) {
          set(where() + '送信失敗（' + rs.label + '）: ' + rs.text + ' ' + rs.advice + (rs.toolFault ? '' : '　このツールの不具合ではありません。') +
            '　［詳細: ' + (r.raw || r.result) + '、' + attempt + ' 回試行］');
          failed.push({ label: name, reason: rs, text: r.raw || r.result });
          next(r); return;
        }
        var why = rs.label + 'のため、受け取りを断られました' + (rs.toolFault ? '' : '（ツールの不具合ではありません）');
        var left = Math.max(1, Math.ceil((r.waitMs || 3000) / 1000));
        attempt++;
        set(where() + why + '。' + left + ' 秒後に ' + attempt + ' 回目を送ります…');
        var timer = setInterval(function () {
          left--;
          if (left <= 0) { clearInterval(timer); step(); }
          else set(where() + why + '。' + left + ' 秒後に ' + attempt + ' 回目を送ります…');
        }, 1000);
      }).withFailureHandler(function (e) {
        set(where() + 'Discord に送れませんでした: ' + e.message);
        failed.push({ label: labels[to] || 'Discord', reason: null, text: e.message });
        finish({ result: e.message });
      }).sendDiscordStep(form);
    }

  function readWhen(dId, hId) {
    var dv = $(dId).value.trim(), hv = $(hId).value.trim(), out = { days: +dv, hour: +hv, err: '' };
    var dOk = /^\d{1,2}$/.test(dv) && out.days <= 30, hOk = /^\d{1,2}$/.test(hv) && out.hour <= 23;
    $(dId).classList.toggle('bad', !dOk); $(hId).classList.toggle('bad', !hOk);
    if (!dOk) out.err = '何日前かは 0〜30 の数で入れてください（0 は当日、1 は前日）。';
    else if (!hOk) out.err = '時刻は 0〜23 の数で入れてください。';
    return out;
  }
  function snWhere(e, withUrl) {
    if (!e || !e.hasWebhook) return D.webhookSet ? '基本のチャンネル' : '送り先なし（基本の URL が未設定）';
    return '専用のチャンネル' + (withUrl ? '（' + e.webhookMasked + '）' : '') + (e.alsoBase && D.webhookSet ? ' ＋ 基本のチャンネル' : '');
  }
  function snWhenText(e) {
    if (!e || (!hasVal(e.days) && !hasVal(e.hour))) return '基本と同じ（' + whenText(baseDays(), baseHour()) + '）';
    return whenText(hasVal(e.days) ? e.days : baseDays(), hasVal(e.hour) ? e.hour : baseHour());
  }
  /* 卓の登録画面の「Discord に知らせる」。シリーズの欄に合わせて、押せるかと送り先を変える */
  function syncNotifyUi(reset) {
    var series = $('series').value.trim(), kind = $('status').value === '募集' ? 'recruit' : '', can = hookFor(series, kind), wasOff = $('notify').disabled, e = seriesHook(series) ? snEntry(series) : null;
    var baseName = kindSet(kind) ? '募集のチャンネル' : '基本のチャンネル', baseOk = kindSet(kind) || !!D.webhookSet;
    $('notify').disabled = !can;
    if (!can) $('notify').checked = false;
    else if (reset || wasOff) $('notify').checked = !!D.notifyDefault;
    $('notifyHint').textContent = !can ? '（Webhook 未設定）' : e ? (e.alsoBase && baseOk ? '（シリーズのチャンネルと' + baseName + 'へ）' : '（シリーズのチャンネルへ）') : kindSet(kind) ? '（募集のチャンネルへ）' : '';
  }
  function renderSeriesNotify() {
    var list = D.seriesNotify || [], names = seriesNames().slice();
    list.forEach(function (x) { if (names.indexOf(x.series) < 0) names.push(x.series); });
    var sel = $('snSeries'), keep = sel.value;
    sel.innerHTML = '';
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = names.length ? '（シリーズを選ぶ）' : '（シリーズの卓がまだありません）'; sel.appendChild(o0);
    names.forEach(function (n) { var o = document.createElement('option'); o.value = n; o.textContent = n + (snEntry(n) ? '（設定あり）' : ''); sel.appendChild(o); });
    sel.value = names.indexOf(keep) >= 0 ? keep : '';
    sel.disabled = !names.length;
    $('snSameLbl').textContent = '開催前の知らせは基本と同じ日時（' + whenText(baseDays(), baseHour()) + '）';
    var h = '';
    if (list.length) {
      h = '<tr><th>シリーズ</th><th>送り先</th><th>開催前の知らせ</th></tr>';
      list.forEach(function (x) { h += '<tr data-sn="' + esc(x.series) + '" tabindex="0"><td>' + esc(x.series) + '</td><td>' + esc(snWhere(x)) + '</td><td class="nw">' + esc(snWhenText(x)) + '</td></tr>'; });
    }
    $('snList').innerHTML = h; $('snListWrap').hidden = !list.length;
    if (!snDraft || !sel.value) { snDraft = false; fillSeriesNotify(); } else syncSnButtons();
  }
  function fillSeriesNotify() {
    var name = $('snSeries').value, e = snEntry(name);
    $('snFields').hidden = !name;
    if (!name) return;
    $('snNow').textContent = 'いま: ' + snWhere(e, true) + '、開催前の知らせは' + snWhenText(e);
    $('snWebhook').value = '';
    $('snAlsoBase').checked = e ? !!e.alsoBase : true;
    $('snSame').checked = !(e && (hasVal(e.days) || hasVal(e.hour)));
    $('snDays').value = String(e && hasVal(e.days) ? e.days : baseDays());
    $('snHour').value = String(e && hasVal(e.hour) ? e.hour : baseHour());
    $('snDays').classList.remove('bad'); $('snHour').classList.remove('bad'); $('snMsg').classList.remove('bad');
    syncSnButtons();
  }
  function syncSnButtons() {
    var e = snEntry($('snSeries').value);
    $('snAlsoBase').disabled = !(e && e.hasWebhook) && !$('snWebhook').value.trim();   // 専用の URL が無ければ、もともと基本のチャンネルへ送る
    $('snTest').disabled = !(e && e.hasWebhook);
    $('snRemove').disabled = !e;
    $('snWhen').hidden = $('snSame').checked;   // 基本と同じなら、日時の欄は出さない
  }
  function pickSeriesNotify(name) { $('snSeries').value = name; snDraft = false; $('snMsg').textContent = ''; fillSeriesNotify(); }
  $('snSeries').addEventListener('change', function () { pickSeriesNotify(this.value); });
  $('snList').addEventListener('click', function (ev) { var tr = ev.target.closest('tr[data-sn]'); if (tr) pickSeriesNotify(tr.dataset.sn); });
  $('snList').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var tr = ev.target.closest('tr[data-sn]'); if (!tr) return;
    ev.preventDefault(); pickSeriesNotify(tr.dataset.sn);
  });
  ['snWebhook', 'snAlsoBase', 'snSame', 'snDays', 'snHour'].forEach(function (id) {
    ['input', 'change'].forEach(function (t) { $(id).addEventListener(t, function () { snDraft = true; syncSnButtons(); }); });
  });
  $('snSave').onclick = function () {
    var name = $('snSeries').value; if (!name) return;
    var form = { series: name, alsoBase: $('snAlsoBase').checked, days: '', hour: '', me: me() };
    if (!$('snSame').checked) {
      var wn = readWhen('snDays', 'snHour');
      if (wn.err) { $('snMsg').textContent = wn.err; $('snMsg').classList.add('bad'); return; }
      form.days = String(wn.days); form.hour = String(wn.hour);
    }
    $('snMsg').classList.remove('bad');
    var w = $('snWebhook').value.trim(); if (w) form.webhook = w;
    var btn = $('snSave'); btn.disabled = true; $('snMsg').textContent = '保存しています…';
    api().withSuccessHandler(function (res) {
      btn.disabled = false; snDraft = false; toast(res.message);
      useData(res, function () { $('snMsg').textContent = res.message; });
      $('snMsg').textContent = res.message;
    }).withFailureHandler(function (e) { btn.disabled = false; $('snMsg').textContent = e.message; $('snMsg').classList.add('bad'); toast(e.message); }).saveSeriesNotify(form);
  };
  $('snTest').onclick = function () {
    var name = $('snSeries').value; if (!name) return;
    $('snTest').disabled = true;
    discordSend({ kind: 'test', series: name },
      function (t) { $('snMsg').textContent = t; },
      function (ok, r) { syncSnButtons(); toast(ok ? '「' + name + '」のチャンネルに届きました' : failToast(r)); refetch(function () { }); });
  };
  $('snRemove').onclick = function () {
    var name = $('snSeries').value; if (!name || !snEntry(name)) return;
    askConfirm({ title: '「' + name + '」の通知の設定を消しますか？', message: 'このシリーズの卓は、基本のチャンネルへ基本の時刻に送るようになります。', ok: '消す', danger: true },
      function () { snDraft = false; stCall('snRemove', 'snMsg', 'saveSeriesNotify', { series: name, remove: true }); });
  };
  $('stClear').onclick = function () {
    askConfirm({ title: 'Webhook URL を空にしますか？', message: 'Discord への通知はすべて止まります。', ok: '空にする', danger: true },
      function () { stCall('stClear', 'stWebhookMsg', 'saveConsoleSettings', { webhook: '', clearWebhook: true }); });
  };
  $('stAutoFinish').addEventListener('change', function () { stCall('stSave', 'stMsg', 'saveConsoleSettings', { autoFinish: this.checked }); });
  $('stNotifyOnSave').onclick = function () {
    stCall('stNotifyOnSave', 'ntMsg', 'saveConsoleSettings', { notifyOnSave: !swOn('stNotifyOnSave') });
  };
  $('stUrge').onclick = function () {
    stCall('stUrge', 'ntMsg', 'saveConsoleSettings', { urge: !swOn('stUrge') });
  };
  $('stSoon').onclick = function () {
    var m = soonMin();
    if (m.err) { ntMsg(m.err, true); $('stSoonMin').focus(); return; }
    drafts.settings = false;
    stCall('stSoon', 'ntMsg', 'saveConsoleSettings', { soon: !swOn('stSoon'), soonMinutes: String(m.n) });
  };
  /* 開始の何分前か。5〜720 の整数だけ通す */
  function soonMin() {
    var v = String($('stSoonMin').value || '').trim(), n = Number(v);
    if (!/^\d+$/.test(v) || n < 5 || n > 720) return { err: '開始の何分前は 5〜720 の数で入れてください。' };
    return { n: n };
  }
  function ntMsg(t, bad) { $('ntMsg').textContent = t; $('ntMsg').className = 'hint' + (bad ? ' bad' : ''); }
  /* 分を変えたら、ON のときだけその場で保存する（OFF なら ON にしたときに一緒に送る） */
  $('stSoonMin').addEventListener('change', function () {
    if (!swOn('stSoon')) return;
    var m = soonMin();
    if (m.err) { ntMsg(m.err, true); return; }
    drafts.settings = false;
    stCall('stSoon', 'ntMsg', 'saveConsoleSettings', { soonMinutes: String(m.n) });
  });
  /* 開催前の知らせ。つまみで有効・解除、日時は欄を離れたときに保存する */
  $('ntRemind').onclick = function () {
    var wn = readWhen('stDays', 'stHour');
    if (wn.err) { sayWhen(); $('stDays').focus(); return; }
    if (swOn('ntRemind')) {
      askConfirm({ title: '開催前の知らせを止めますか？', message: '自動で送るのをやめます。あとからいつでも戻せます。', ok: '止める', danger: true },
        function () { stCall('ntRemind', 'ntMsg', 'setAutoNotify', { enabled: false }); });
      return;
    }
    askConfirm({ title: '開催前の知らせを送りますか？', message: '開催日の' + whenText(wn.days, wn.hour) + 'に、卓の知らせを Discord に送ります。シリーズごとに日時を決めた卓は、その日時に送ります。', ok: '送る' }, function () {
      drafts.settings = false;
      stCall('ntRemind', 'ntMsg', 'setAutoNotify', { enabled: true, days: String(wn.days), hour: String(wn.hour), me: me() });
    });
  };
  ['stDays', 'stHour'].forEach(function (id) {
    $(id).addEventListener('change', function () {
      if (!swOn('ntRemind')) return;   // まだ送っていないなら、つまみを入れたときに一緒に送る
      var wn = readWhen('stDays', 'stHour');
      if (wn.err) { sayWhen(); return; }
      drafts.settings = false;
      stCall('ntRemind', 'ntMsg', 'saveConsoleSettings', { days: String(wn.days), hour: String(wn.hour) });
    });
  });
  /* 基本の日時の例え。「9/26（土）の卓なら、9/25（金）の 20 時台に届きます」 */
  function sayWhen() {
    var el = $('stWhenSay'), wn = readWhen('stDays', 'stHour');
    el.classList.toggle('bad', !!wn.err);
    if (wn.err) { el.textContent = wn.err; return; }
    var ex = addDaysYmd(D.today, 7);
    var line = '例: ' + fmtJa(ex) + 'の卓なら、' + fmtJa(addDaysYmd(ex, -wn.days)) + 'の ' + wn.hour + ' 時台に届きます。';
    el.textContent = (D.settings || {}).setter ? line : line + '（いまは送っていません。右のつまみで始められます）';
  }
  ['stDays', 'stHour'].forEach(function (id) { $(id).addEventListener('input', sayWhen); });
  ['stDays', 'stHour', 'stCalMonths', 'stAvailDays', 'stSoonMin'].forEach(function (id) { $(id).addEventListener('input', function () { drafts.settings = true; }); });
  $('stAutoRefresh').addEventListener('change', function () {
    store('autoRefresh', this.value); showLoadedAt();
    toast(+this.value ? '自動更新を ' + this.value + ' 分ごとにしました（この端末だけ）' : '自動更新を止めました（この端末だけ）');
  });
  $('stTheme').addEventListener('change', function () { setTheme(this.value); });
  /* 文字サイズ。画面全体を拡げる（この端末だけ） */
  function setFont(v) {
    var el = document.documentElement;
    if (v === 'm' || v === 'l') { el.setAttribute('data-font', v); el.style.setProperty('--zoom', v === 'l' ? '1.25' : '1.12'); }
    else { el.removeAttribute('data-font'); el.style.removeProperty('--zoom'); }
    store('font', v);
  }
  $('stFont').addEventListener('change', function () {
    setFont(this.value);
    toast('文字サイズを' + (this.value === 'l' ? '大' : this.value === 'm' ? '中' : '小') + 'にしました（この端末だけ）');
  });
  $('stSave').onclick = function () { drafts.settings = false; stCall('stSave', 'stMsg', 'saveConsoleSettings', { calMonths: $('stCalMonths').value.trim(), availDays: $('stAvailDays').value.trim() }); };
  $('stPwChange').onclick = function () {
    var cur = $('stPwCurrent').value, nw = $('stPwNew').value, cf = $('stPwConfirm').value;
    if (!cur.trim() || !nw.trim()) { $('stPwMsg').textContent = 'いまの合言葉と新しい合言葉を入れてください。'; return; }
    if (nw.trim() !== cf.trim()) { $('stPwMsg').textContent = '新しい合言葉の 2 つの入力が合っていません。'; return; }
    askConfirm({ title: '合言葉を変えますか？', message: 'ほかの人は、次に開いたときに新しい合言葉を求められます。', ok: '変える' }, function () {
      $('stPwChange').disabled = true; $('stPwMsg').textContent = '変えています…';
      api().withSuccessHandler(function (res) {
        $('stPwChange').disabled = false; store('token', res.token);
        $('stPwCurrent').value = ''; $('stPwNew').value = ''; $('stPwConfirm').value = '';
        $('stPwMsg').textContent = res.message; toast('合言葉を変えました');
      }).withFailureHandler(function (e) { $('stPwChange').disabled = false; $('stPwMsg').textContent = e.message; })
        .changePassword({ current: cur, password: nw, confirm: cf });
    });
  };
  /* ---- タブ ---- */
  function showTab(name) {
    var tabs = ['cal', 'recruit', 'avail', 'members', 'settings'];
    if (tabs.indexOf(name) < 0) name = 'cal';
    var prev = document.body.getAttribute('data-tab');
    tabs.forEach(function (t) { $('tab-' + t).hidden = t !== name; });
    var btns = document.querySelectorAll('nav.tabs button[data-tab]');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].dataset.tab === name;
      btns[i].className = on ? 'on' : '';
      if (on) btns[i].setAttribute('aria-current', 'page'); else btns[i].removeAttribute('aria-current');
    }
    document.body.setAttribute('data-tab', name);
    if (name === 'settings') showSetPane(load('setPane') || 'notify');   // 前に見ていた区分から開く
    if (prev && prev !== name && window.scrollY > 0) window.scrollTo(0, 0);   // 別の画面に移ったら先頭から
    store('tab', name);
  }
  document.querySelector('nav.tabs').addEventListener('click', function (ev) { var b = ev.target.closest('button[data-tab]'); if (b) showTab(b.dataset.tab); });
  $('reload').onclick = function () { reload(true); };

  /* ---- テーマ（見ている側だけ） ---- */
  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function applyThemeButton() {
    var dark = currentTheme() === 'dark', t = document.documentElement.getAttribute('data-theme');
    $('theme').innerHTML = mi(dark ? 'light_mode' : 'dark_mode', 'sm'); $('theme').setAttribute('aria-label', dark ? 'ライトに切り替える' : 'ダークに切り替える');
    $('stTheme').value = t === 'dark' || t === 'light' ? t : '';
  }
  /* t は 'light' か 'dark'。空なら端末の設定に合わせる */
  function setTheme(t) {
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
    store('theme', t || '');
    applyThemeButton();
  }
  $('theme').onclick = function () { setTheme(currentTheme() === 'dark' ? 'light' : 'dark'); };
  if (window.matchMedia) { var darkMq = window.matchMedia('(prefers-color-scheme: dark)'); if (darkMq.addEventListener) darkMq.addEventListener('change', applyThemeButton); }
  applyThemeButton();

  if (!HTMLElement.prototype.hasOwnProperty('popover')) {
    document.querySelectorAll('[popovertarget]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = $(b.getAttribute('popovertarget')); if (!p) return;
        p.classList.toggle('pop-open', b.getAttribute('popovertargetaction') !== 'hide' && !p.classList.contains('pop-open'));
      });
    });
  }
  paintFromCache();
  $('iconLegend').innerHTML = CAL_LEGEND.map(function (x) { return '<span class="li' + (x[2] ? ' ' + x[2] : '') + '">' + mi(x[0], 'xs') + x[1] + '</span>'; }).join('');
  reload(false);
</script>
