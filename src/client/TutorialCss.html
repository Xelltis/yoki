<style>
  /* ---- 色。アプリと同じ組み立て: 黒い帯に水色、状態の色はミント・ローズ・バイオレット ---- */
  :root {
    color-scheme: light;
    --ink: #0b111b; --ink-line: #1f2935; --on-ink: #f1f5f9; --on-ink-muted: #97a3b4; --ice: #22d3ee; --ice-ink: #042f37;
    --ink-cell: rgba(255, 255, 255, .045); --ink-cell-line: rgba(255, 255, 255, .08); --ink-me-line: rgba(34, 211, 238, .45);
    --ink-soft-bg: rgba(52, 211, 153, .14); --ink-soft-text: #6ee7b7; --ink-ng-bg: rgba(251, 113, 133, .17); --ink-ng-text: #fda4af;
    --ink-ok-bg: rgba(34, 211, 238, .16); --ink-sun: #fb7185; --ink-sat: #7dd3fc;
    --bg: #f2f4f7; --surface: #ffffff; --surface-2: #f0f2f5; --line: #e2e6ec; --line-strong: #c9d0da;
    --text: #0b111b; --muted: #5a6474; --accent: #0891b2; --accent-text: #0e7490; --accent-soft: #e0f5f9; --accent-line: #a3dde9;
    --primary: #0b111b; --primary-ink: #ffffff;
    --ok: #ccf0e0; --ok-text: #046c4e; --soft: #e9f7f1; --warn: #fde1e7; --err-text: #be123c; --soon: #eeeafd; --violet: #6d28d9;
    --session: #e3eaf8; --past: #eceff3; --today: #dff5fa; --sun: #d4163f; --sat: #0369a1;
    --shadow: 0 1px 2px rgba(11, 17, 27, .05), 0 16px 40px rgba(11, 17, 27, .07);
    --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "BIZ UDPGothic", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    --font-body: "Segoe UI Variable Text", "Segoe UI", "Hiragino Sans", "BIZ UDPGothic", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    --font-mono: "Martian Mono", "BIZ UDGothic", "Hiragino Sans", "Noto Sans JP", ui-monospace, monospace;
    --gutter: max(16px, env(safe-area-inset-left));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ink: #06080c; --ink-line: #1a2029;
      --bg: #0b0e13; --surface: #12161d; --surface-2: #171c24; --line: #232a34; --line-strong: #343d49;
      --text: #e6ebf2; --muted: #8d98a8; --accent: #22d3ee; --accent-text: #67e8f9; --accent-soft: #0b2930; --accent-line: #155e6b;
      --primary: #e6ebf2; --primary-ink: #0b0e13;
      --ok: #0c3a2d; --ok-text: #34d399; --soft: #10271f; --warn: #3b141f; --err-text: #fb7185; --soon: #231b3f; --violet: #a78bfa;
      --session: #16213a; --past: #1a1f27; --today: #0b2930; --sun: #fb7185; --sat: #38bdf8;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 16px 40px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #06080c; --ink-line: #1a2029;
    --bg: #0b0e13; --surface: #12161d; --surface-2: #171c24; --line: #232a34; --line-strong: #343d49;
    --text: #e6ebf2; --muted: #8d98a8; --accent: #22d3ee; --accent-text: #67e8f9; --accent-soft: #0b2930; --accent-line: #155e6b;
    --primary: #e6ebf2; --primary-ink: #0b0e13;
    --ok: #0c3a2d; --ok-text: #34d399; --soft: #10271f; --warn: #3b141f; --err-text: #fb7185; --soon: #231b3f; --violet: #a78bfa;
    --session: #16213a; --past: #1a1f27; --today: #0b2930; --sun: #fb7185; --sat: #38bdf8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 16px 40px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.85 var(--font-body); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  table { font: inherit; color: inherit; }
  a { color: var(--accent-text); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p, li { text-wrap: pretty; }
  .ms {
    font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal;
    text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
    font-variation-settings: 'FILL' 0; width: 1em; overflow: hidden; flex-shrink: 0; vertical-align: -4px; user-select: none;
  }
  .ms.fill { font-variation-settings: 'FILL' 1; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: 1160px; margin: 0 auto; padding-inline: var(--gutter); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* アプリの画面にあるボタンの名前。本文の中で「どれを押すか」を見た目で示す */
  .ui { display: inline-flex; align-items: center; gap: 3px; padding: 0 8px; margin: 0 1px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: .86em; font-weight: 600; line-height: 1.7; white-space: nowrap; vertical-align: 1px; }
  .ui .ms { font-size: 1.1em; vertical-align: 0; }
  .ui.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .mark { display: inline-block; min-width: 1.6em; padding: 0 4px; border-radius: 5px; text-align: center; font-weight: 600; line-height: 1.6; }
  .mark.soft { background: var(--soft); color: var(--ok-text); }
  .mark.ng { background: var(--warn); color: var(--err-text); }
  .mark.ok { background: var(--ok); color: var(--ok-text); }

  /* ---- 冒頭: 黒い帯。アプリの上のバーの続きとして置き、予定表をその場で触れるようにする ---- */
  .hero { background: var(--ink); color: var(--on-ink); border-bottom: 1px solid var(--ink-line); }
  .hero .brand { display: flex; align-items: center; gap: 10px; padding-block: 18px; font-weight: 700; font-size: 15px; }
  .logo { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: var(--ice); color: var(--ice-ink); }
  .logo .ms { vertical-align: 0; }
  .brand .sub { color: var(--on-ink-muted); font-weight: 400; }
  .hero-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px); gap: 48px; align-items: center; padding-block: 28px 56px; }
  .hero-body.slim { grid-template-columns: minmax(0, 1fr); padding-block: 8px 40px; }
  .hero-body.slim h1 { font-size: clamp(28px, 4vw, 40px); }
  .hero h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(32px, 5vw, 52px); line-height: 1.22; }
  .hero h1 em { font-style: normal; color: var(--ice); }
  .hero .lede { margin: 20px 0 0; max-width: 30em; color: var(--on-ink-muted); font-size: 16px; }
  .hero .lede b { color: var(--on-ink); font-weight: 600; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .btn-ink { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 20px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: transform .12s ease-out, background-color .12s ease-out; }
  .btn-ink:active { transform: scale(.97); }
  .btn-ink.solid { background: var(--ice); color: var(--ice-ink); }
  .btn-ink.line { background: transparent; color: var(--on-ink); border-color: rgba(255, 255, 255, .22); }
  .btn-ink.line:hover { background: rgba(255, 255, 255, .06); }
  .btn-ink:focus-visible, .hero :focus-visible, .foot :focus-visible { outline-color: var(--ice); }

  .board { background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink-line); border-radius: 14px; padding: 14px 12px 10px; }
  .board :focus-visible { outline-color: var(--ice); }
  .board .avgrid { border-spacing: 3px; }
  .board .avgrid th { min-width: 38px; }
  .board .avgrid th.name { min-width: 0; padding-right: 4px; }
  .board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 4px 8px; font-size: 13px; color: var(--on-ink-muted); }
  .board-head b { color: var(--on-ink); font-weight: 600; }
  .board-scroll { overflow-x: auto; }
  .avgrid { border-collapse: separate; border-spacing: 4px; margin: 0 auto; }
  .avgrid th { font-family: var(--font-mono); font-weight: 400; font-size: 11px; line-height: 1.35; color: var(--on-ink-muted); padding: 4px 0; border-radius: 8px; min-width: 42px; }
  .avgrid th .d { display: block; font-size: 12px; font-weight: 600; color: var(--on-ink); }
  .avgrid th.sun .w { color: var(--ink-sun); } .avgrid th.sat .w { color: var(--ink-sat); }
  .avgrid th.name { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--on-ink); text-align: left; padding-right: 6px; white-space: nowrap; min-width: 0; }
  .avgrid tr.me th.name { color: var(--ice); }
  .avgrid td { height: 38px; padding: 0; text-align: center; border-radius: 8px; background: var(--ink-cell); box-shadow: inset 0 0 0 1px var(--ink-cell-line); font-size: 15px; font-weight: 600; }
  .avgrid td.m-soft { background: var(--ink-soft-bg); color: var(--ink-soft-text); }
  .avgrid td.m-ng { background: var(--ink-ng-bg); color: var(--ink-ng-text); }
  .avgrid tr.me td { box-shadow: inset 0 0 0 1px var(--ink-me-line); }
  .avgrid .mk { width: 100%; height: 38px; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; cursor: pointer; transition: transform .1s ease-out; }
  .avgrid .mk:active { transform: scale(.9); }
  .avgrid .mk .hint { color: var(--on-ink-muted); opacity: .6; font-weight: 400; }
  .avgrid tr.sum th.name { color: var(--on-ink-muted); font-weight: 400; }
  .avgrid tr.sum td { background: transparent; box-shadow: none; font-size: 13px; color: var(--on-ink-muted); }
  .avgrid .ok { background: var(--ink-ok-bg) !important; color: var(--ice) !important; }
  .avgrid tr.sum td.soft { color: var(--ink-soft-text); }
  .board-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 4px 0; font-size: 12px; color: var(--on-ink-muted); }
  .board-foot .live { color: var(--on-ink); }
  .board-foot i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 3px; vertical-align: -1px; font-style: normal; }

  /* ---- 本文: 左に目次、右に章 ---- */
  .layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 64px; padding-block: 56px 96px; }
  .index { position: sticky; top: 24px; align-self: start; font-size: 14px; }
  .index .grp { margin: 22px 0 6px; padding-left: 10px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--muted); }
  .index .grp:first-child { margin-top: 0; }
  .index a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; color: var(--muted); text-decoration: none; line-height: 1.4; }
  .index a .ms { font-size: 18px; }
  .index a:hover { color: var(--text); background: var(--surface-2); }
  .index a[aria-current="true"] { color: var(--text); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
  .index a[aria-current="true"] .ms { color: var(--accent-text); font-variation-settings: 'FILL' 1; }

  .chapters { display: flex; flex-direction: column; gap: 96px; min-width: 0; }
  .chapter { scroll-margin-top: 24px; }
  .eyebrow { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; color: var(--muted); }
  .eyebrow .role { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text); }
  .eyebrow .role.gm { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .chapter h2 { font-family: var(--font-display); font-weight: 900; font-size: clamp(26px, 3.2vw, 34px); line-height: 1.3; }
  .chapter .lead { margin: 14px 0 0; max-width: 36em; font-size: 17px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; margin-top: 32px; }
  .points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 18px; }
  .points li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
  .points li > .ms { color: var(--accent-text); margin-top: 5px; }
  .points b { font-weight: 700; }
  .points p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }

  .stage { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px 20px; box-shadow: var(--shadow); min-width: 0; }
  .stage-cap { display: flex; align-items: center; gap: 6px; margin: 0 0 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--muted); }
  .stage-cap.try { color: var(--accent-text); }
  .stage-cap .ms { font-size: 16px; vertical-align: 0; }
  .say { min-height: 1.7em; margin: 14px 0 0; font-size: 14px; color: var(--muted); }
  .say b { color: var(--text); }

  /* アプリの部品の写し */
  .pill-btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: transform .12s ease-out, background-color .12s ease-out; }
  .pill-btn:hover:not(:disabled) { background: var(--surface-2); }
  .pill-btn:active:not(:disabled) { transform: scale(.96); }
  .pill-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); }
  .pill-btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .pill-btn:disabled { opacity: .45; cursor: not-allowed; }
  .pill-btn .ms { font-size: 18px; vertical-align: 0; }
  .card-title { font-size: 17px; font-weight: 700; line-height: 1.4; }
  .card-when { color: var(--accent-text); font-weight: 600; font-size: 14px; }
  .people { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .people span { padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; line-height: 22px; }
  .people span.gm { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 700; }
  .people span.you { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 14px; margin-top: 10px; font-size: 14px; }
  .kv dt { color: var(--muted); font-weight: 600; }
  .kv dd { margin: 0; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .status { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 600; line-height: 20px; vertical-align: 2px; }
  .status.planned { background: var(--ok); color: var(--ok-text); }

  /* 3 ステップ（順番に意味がある） */
  .steps { list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
  .steps li { padding-top: 16px; border-top: 2px solid var(--text); }
  .steps .n { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--accent-text); }
  .steps h3 { margin-top: 6px; font-size: 19px; font-weight: 700; line-height: 1.45; }
  .steps p { margin: 8px 0 0; font-size: 15px; color: var(--muted); }

  /* 色の読み方 */
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 0; }
  .legend div { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; }
  .legend dt { height: 34px; border-radius: 8px; border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; font-weight: 600; display: flex; align-items: flex-start; padding: 3px 5px; }
  .legend dd { margin: 0; font-size: 13px; line-height: 1.45; }
  .legend dd small { display: block; color: var(--muted); font-size: 12px; }
  .icons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px; margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; }
  .icons span { display: inline-flex; align-items: center; gap: 6px; }
  .icons .ms { color: var(--accent-text); font-size: 18px; vertical-align: 0; }
  .icons .v .ms { color: var(--violet); }

  /* 日程調整 */
  .poll { margin-top: 12px; border-top: 1px solid var(--line); }
  .poll-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .poll-date { font-family: var(--font-mono); font-weight: 600; font-size: 14px; }
  .poll-date .cnt { margin-left: 8px; font-weight: 400; color: var(--muted); font-size: 12px; }
  .poll-row.all .poll-date .cnt { color: var(--ok-text); font-weight: 600; }
  .poll-names { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .vote { min-width: 46px; font-size: 15px; }
  .vote.on-ok { background: var(--ok); border-color: var(--ok-text); color: var(--ok-text); }
  .vote.on-ng { background: var(--warn); border-color: var(--err-text); color: var(--err-text); }
  .decided { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--ok); color: var(--ok-text); font-weight: 600; font-size: 14px; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }

  /* 卓を登録 */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .day { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 58px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer; text-align: left; }
  .day:hover { background: var(--surface-2); }
  .day .w { font-size: 11px; color: var(--muted); }
  .day .d { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
  .day.sun .w { color: var(--sun); } .day.sat .w { color: var(--sat); }
  .day[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .form-peek { margin-top: 14px; padding: 14px; border-radius: 12px; background: var(--surface-2); animation: pop .18s ease-out; }
  .form-peek .t { font-weight: 700; }
  .field { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; }
  .field span:last-child { min-height: 34px; display: flex; align-items: center; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font-family: var(--font-mono); }
  .field .empty { color: var(--muted); font-family: var(--font-body); }

  /* 状態の流れ（順番に意味がある） */
  .track { list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .track li { position: relative; padding-top: 44px; }
  .track li::before { content: ""; position: absolute; top: 17px; left: 36px; right: -12px; height: 2px; background: var(--line-strong); }
  .track li:last-child::before { display: none; }
