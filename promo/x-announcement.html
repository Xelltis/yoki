<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Yoki X用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&family=Geist+Mono:wght@500;600&family=Noto+Sans+JP:wght@500;700;900&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,1,0&icon_names=add,bolt,campaign,casino,check,how_to_vote,no_accounts,notifications&display=block">
<style>
  /* 卓予定（session-scheduler）の配色を下敷きにした X 用の告知画像。1600×900 で組み、2 倍で書き出す */
  :root {
    --bg: #06080c;
    --ink: #f1f5f9;
    --muted: #97a3b4;
    --faint: #5d6878;
    --line: rgba(255, 255, 255, .09);
    --accent: #22d3ee;            /* 図形・光だけに使う */
    --accent-text: #93dce8;       /* 文字に使う水色は彩度を落とす */
    --green: #34d399;
    --green-text: #8fdcbc;
    --violet-text: #c4b5fd;
    --blurple: #8b93f5;           /* Discord の色を落としたもの */
    --blurple-text: #c9cdfb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-feature-settings: "palt";
    -webkit-font-smoothing: antialiased;
  }
  .en { font-family: "Geist", "Noto Sans JP", sans-serif; font-feature-settings: normal; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; font-feature-settings: normal; }
  .ms {
    font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal;
    line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap;
    font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24;
  }

  .canvas { position: relative; width: 1600px; height: 900px; overflow: hidden; isolation: isolate; }

  /* ---- 背景：光と点の格子 ---- */
  .bg { position: absolute; inset: 0; z-index: -1; }
  .bg::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, .075) 1.2px, transparent 1.6px);
    background-size: 30px 30px;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 72% 40%, #000 20%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 80% at 72% 40%, #000 20%, transparent 75%);
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .g1 { width: 760px; height: 560px; left: 900px; top: -160px; background: rgba(34, 211, 238, .20); }
  .g2 { width: 560px; height: 440px; left: -160px; top: 620px; background: rgba(34, 211, 238, .10); }
  .g3 { width: 560px; height: 420px; left: 1160px; top: 600px; background: rgba(88, 101, 242, .18); }

  /* ---- 左：名前と見出し ---- */
  .hero { position: absolute; left: 72px; top: 64px; width: 600px; height: 772px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark {
    width: 52px; height: 52px; border-radius: 15px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #5fe3f5, #14b8d4);
    color: #042f37; font-size: 32px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .18) inset, 0 10px 30px rgba(34, 211, 238, .35);
  }
  .kind {
    font-size: 25px; font-weight: 700; letter-spacing: .06em; color: var(--ink);
    padding: 9px 20px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, .05); border: 1px solid var(--line);
  }
  .word {
    margin-top: 34px; margin-left: -10px;
    font-size: 272px; line-height: .86; font-weight: 700; letter-spacing: -.055em;
    color: var(--ink);
    display: flex; align-items: flex-end;
  }
  .word .i { position: relative; }
  .word .dot {
    /* 点は ı の縦棒と同じ幅・同じ位置（Geist 700 で測った値） */
    position: absolute; left: .0659em; top: .027em;
    width: .1495em; height: .1495em;
    border-radius: .036em;
    background: linear-gradient(145deg, #6be6f7, #14b8d4);
    box-shadow: 0 0 40px rgba(34, 211, 238, .55);
  }
  .lead {
    margin-top: 52px;
    font-size: 84px; line-height: 1.16; font-weight: 900; letter-spacing: .01em;
  }
  .lead .soft {
    background: linear-gradient(95deg, #f1f5f9 10%, #9fdfea 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* アカウント不要・かんたん設定の札 */
  .perks { position: absolute; left: 0; bottom: 0; display: flex; gap: 12px; }
  .perk {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 24px 16px 16px; border-radius: 999px;
    font-size: 32px; font-weight: 900; line-height: 1; white-space: nowrap;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .13);
    box-shadow: 0 20px 50px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .07);
  }
  .perk .ms { font-size: 34px; color: var(--accent-text); }
  .perk .en { font-weight: 800; letter-spacing: -.01em; }
  .perk.hot {
    background: linear-gradient(145deg, #67e3f4, #1cc3dd); color: #042f37; border-color: transparent;
    box-shadow: 0 20px 50px rgba(34, 211, 238, .30), inset 0 1px 0 rgba(255, 255, 255, .45);
  }
  .perk.hot .ms { color: #042f37; }

  /* ---- 右：タイル ---- */
  .bento {
    position: absolute; left: 700px; top: 56px; width: 844px; height: 788px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 380px 1fr; gap: 22px;
  }
  .tile {
    position: relative; overflow: hidden;
    border-radius: 30px; padding: 30px 34px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .022));
    border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 30px 70px rgba(0, 0, 0, .35);
  }
  .tag { font-size: 17px; font-weight: 600; letter-spacing: .16em; color: var(--muted); }
  .ttl { font-weight: 900; letter-spacing: .01em; line-height: 1.18; }

  /* 3 ステップ */
  .t2 { grid-column: 1 / 3; display: flex; gap: 30px; }
  .t2 .lhs { flex: 0 0 318px; display: flex; flex-direction: column; }
  .t2 .big { display: flex; align-items: flex-end; gap: 10px; margin-top: 30px; }
  .t2 .num {
    font-size: 196px; line-height: .78; font-weight: 800; letter-spacing: -.06em;
    background: linear-gradient(180deg, #f5fbfd 15%, #6fd2e2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 10px 30px rgba(34, 211, 238, .25));
  }
  .t2 .ttl { font-size: 44px; padding-bottom: 2px; white-space: nowrap; }
  .t2 .ttl2 { font-size: 58px; margin-top: 16px; }
  .flow { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .flow::before {
    content: ""; position: absolute; left: 39px; top: 60px; bottom: 60px; width: 2px;
    background: linear-gradient(180deg, rgba(34, 211, 238, .55), rgba(34, 211, 238, .15));
  }
  .st {
    position: relative; display: flex; align-items: center; gap: 18px;
    height: 88px; padding: 0 18px;
    border-radius: 22px; background: rgba(255, 255, 255, .045); border: 1px solid var(--line);
  }
  .st .n {
    flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    font-family: "Geist Mono", monospace; font-size: 21px; font-weight: 600;
    background: #0d2a31; color: var(--accent-text); box-shadow: 0 0 0 2px rgba(34, 211, 238, .45);
  }
  .st b { font-size: 34px; font-weight: 900; white-space: nowrap; }
  .st .side { margin-left: auto; display: flex; align-items: center; }
  .pill {
    display: flex; align-items: center; gap: 6px; padding: 7px 14px 7px 10px; border-radius: 999px;
    font-size: 18px; font-weight: 600; white-space: nowrap;
    background: rgba(88, 101, 242, .20); color: var(--blurple-text);
  }
  .pill .ms { font-size: 20px; }
  .plus {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(145deg, #67e3f4, #1cc3dd); color: #042f37; font-size: 28px;
    box-shadow: 0 8px 24px rgba(34, 211, 238, .35);
  }
  .plus .ms { font-variation-settings: "FILL" 1, "wght" 700, "GRAD" 0, "opsz" 24; }

  .avs { display: flex; }
  .av {
    width: 34px; height: 34px; border-radius: 50%; margin-left: -9px;
    display: grid; place-items: center; font-size: 15px; font-weight: 700;
    border: 2px solid #171c24; color: #0b111b;
  }
  .av:nth-child(1) { background: #f3c9a8; margin-left: 0; } .av:nth-child(2) { background: #a8d8f3; } .av:nth-child(3) { background: #c9b8f5; }
  .av.more { background: rgba(255, 255, 255, .12); color: var(--ink); font-family: "Geist", sans-serif; font-weight: 600; }

  /* 募集・日程調整 */
  .t3 { display: flex; flex-direction: column; }
  .t3 .ttl { font-size: 42px; margin-top: 14px; }
  .t3 .ttl .one { color: var(--accent-text); }
  .rows { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-radius: 16px;
    background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
  }
  .row .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; flex: none; }
  .row .ic.v { background: rgba(167, 139, 250, .16); color: var(--violet-text); }
  .row .ic.c { background: rgba(34, 211, 238, .14); color: var(--accent-text); }
  .row b { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .row .avs { margin-left: auto; }
  .row .av { width: 32px; height: 32px; font-size: 14px; margin-left: -8px; }
  .row .av:nth-child(1) { margin-left: 0; }
  .marks { display: flex; gap: 5px; margin-left: auto; align-items: center; }
  .mk { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid var(--green-text); }
  .fix {
    display: flex; align-items: center; gap: 4px; margin-left: 6px;
    padding: 5px 12px 5px 8px; border-radius: 999px; white-space: nowrap;
    background: rgba(52, 211, 153, .16); color: var(--green-text); font-size: 17px; font-weight: 700;
  }
  .fix .ms { font-size: 18px; }

  /* Discord 通知 */
  .t4 { display: flex; flex-direction: column; }
  .t4 .ttl { font-size: 42px; margin-top: 14px; }
  .t4 .ttl .en { font-weight: 800; letter-spacing: -.01em; }
  .msg {
    margin-top: auto; display: flex; gap: 12px;
    padding: 14px 16px 15px; border-radius: 18px;
    background: rgba(88, 101, 242, .10); border: 1px solid rgba(139, 147, 245, .22);
    box-shadow: inset 4px 0 0 var(--blurple);
  }
  .msg .ava {
    flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(145deg, #5fe3f5, #14b8d4); color: #042f37; font-size: 26px;
  }
  .msg .who { display: flex; align-items: baseline; gap: 8px; }
  .msg .who b { font-size: 19px; font-weight: 700; }
  .msg .who span { font-size: 14px; color: var(--muted); }
  .msg .body { margin-top: 3px; font-size: 18px; line-height: 1.45; color: #dfe5ec; }
  .msg .body .en { font-weight: 600; }
  .ment { display: flex; gap: 5px; margin-top: 6px; }
  .ment span {
    padding: 1px 7px 2px; border-radius: 5px; font-size: 16px; font-weight: 600;
    background: rgba(88, 101, 242, .30); color: var(--blurple-text);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div></div>

  <section class="hero">
    <div class="brand">
      <div class="mark"><span class="ms" aria-hidden="true">casino</span></div>
      <div class="kind">グループの予定管理ツール</div>
    </div>
    <h1 class="word en">Yok<span class="i">ı<span class="dot"></span></span></h1>
    <p class="lead">集まる日が、<br><span class="soft">すぐ決まる。</span></p>

    <div class="perks">
      <div class="perk hot"><span class="ms" aria-hidden="true">no_accounts</span><span>アカウント不要</span></div>
      <div class="perk"><span class="ms" aria-hidden="true">bolt</span>かんたん設定</div>
    </div>
  </section>

  <section class="bento">
    <!-- 3 ステップ -->
    <div class="tile t2">
      <div class="lhs">
        <div class="tag mono">3 STEPS</div>
        <div class="big"><div class="num en">3</div><div class="ttl">ステップで</div></div>
        <div class="ttl ttl2">すぐ使える</div>
      </div>
      <div class="flow">
        <div class="st"><span class="n">1</span><b>メンバー登録</b>
          <div class="side avs"><span class="av">ア</span><span class="av">ボ</span><span class="av">カ</span><span class="av more">+2</span></div></div>
        <div class="st"><span class="n">2</span><b>通知設定</b>
          <div class="side"><span class="pill"><span class="ms" aria-hidden="true">notifications</span><span class="en">Discord</span></span></div></div>
        <div class="st"><span class="n">3</span><b>予定登録</b>
          <div class="side"><span class="plus"><span class="ms" aria-hidden="true">add</span></span></div></div>
      </div>
    </div>

    <!-- 募集・日程調整 -->
    <div class="tile t3">
      <div class="tag mono">ALL IN ONE</div>
      <div class="ttl">募集も<br>日程調整も<br><span class="one">これ1つで。</span></div>
      <div class="rows">
        <div class="row">
          <div class="ic v"><span class="ms" aria-hidden="true">campaign</span></div>
          <b>募集</b>
          <div class="avs"><span class="av">ア</span><span class="av">ボ</span><span class="av">カ</span></div>
        </div>
        <div class="row">
          <div class="ic c"><span class="ms" aria-hidden="true">how_to_vote</span></div>
          <b>日程調整</b>
          <div class="marks"><span class="mk"></span><span class="mk"></span><span class="mk"></span>
            <span class="fix"><span class="ms" aria-hidden="true">check</span>決定</span></div>
        </div>
      </div>
    </div>

    <!-- Discord 通知 -->
    <div class="tile t4">
      <div class="tag mono">NOTIFY</div>
      <div class="ttl"><span class="en">Discord</span>に<br>自動で通知</div>
      <div class="msg">
        <div class="ava"><span class="ms" aria-hidden="true">casino</span></div>
        <div>
          <div class="who"><b class="en">Yoki</b><span>今日 <span class="en">20:00</span></span></div>
          <div class="body">「星降る港の依頼」は<br>明日 <span class="en">21:00</span> からです</div>
          <div class="ment"><span>@アリス</span><span>@ボブ</span><span>@カレン</span></div>
        </div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
