# 版を出す（元のリポジトリだけで動く。フォークでは動かさない）。
# main に入ったコミット（Conventional Commits）から、次の版と変わったことの一覧（CHANGELOG.md）を書いた PR を release-please が作る。
# その PR をマージすると、package.json の版が上がり、タグ（v1.2.3）と GitHub の Release ができる。
# 各地の卓予定は、運営の管理画面でこの Release を見て、更新のワークフロー（update.yml）で取り込む
name: 版を出す

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
