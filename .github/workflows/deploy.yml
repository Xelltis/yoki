# アプリ（Worker と D1）を GitHub Actions で Cloudflare に公開する。
# 動くのは、元のリポジトリ（Xelltis/yoki）と、そのフォークと、Actions で公開すると決めたリポジトリ（Repository variables の YOKI_DEPLOY_WITH_ACTIONS が true）だけ。
# 「Deploy to Cloudflare」のボタンで設置したリポジトリ（フォークではない）は、Cloudflare の組み立て（Workers Builds）が公開するので、ここは動かない。
# main にアプリの変更が入ったときと、Actions の画面から手で動かしたときに動く。確かめる → 版を出す（元のリポジトリだけ）→ 公開する、の順に進む。
# 版は、元のリポジトリでは semantic-release（設定は .releaserc.json）が main のコミットから決め、package.json の version を書き換えてコミットし、
# タグ vX.Y.Z と GitHub の Release を作る。アプリに入れる版は package.json から読む（vite.config.ts）
# 公開する Cloudflare ごとの値はリポジトリに置かず、GitHub の environment「production」に置く（書き方は docs/deployment.md の「GitHub Actions で公開する」）
#   変数（vars）: CLOUDFLARE_ACCOUNT_ID・YOKI_D1_DATABASE_ID・YOKI_DISCORD_CLIENT_ID・YOKI_APP_URL（任意）・YOKI_GOOGLE_CLIENT_ID（任意）・YOKI_UPSTREAM（任意）
#   秘密（secrets）: CLOUDFLARE_API_TOKEN・DISCORD_CLIENT_SECRET・DISCORD_BOT_TOKEN・OPERATOR_IDS・GOOGLE_CLIENT_SECRET（任意）・GOOGLE_TOKEN_KEY（任意）・UPDATE_DISPATCH_TOKEN（任意）
#   D1 の ID とリポジトリの名前は組み立てた設定に入れ、ほかは Worker の secret にする（var にしない。src/worker/env.ts）
#   運営の管理画面の「更新」のボタンで更新するときだけ、UPDATE_DISPATCH_TOKEN を入れる。更新のワークフロー（update.yml）も、このワークフローを動かす
name: アプリを公開する

on:
  push:
    branches: [main]
    paths:
      - src/**
      - migrations/**
      - wrangler.jsonc
      - vite.config.ts
      - package.json
      - package-lock.json
      - .node-version
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# 公開は 1 つずつ。途中の公開は止めない（表の変更の途中で止まらないように）
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # 型の確認・lint・テストとカバレッジ（100% を下回ったら止まる）。通らなければ、版も出さず公開もしない
  check:
    if: github.repository == (vars.YOKI_UPSTREAM || 'Xelltis/yoki') || github.event.repository.fork || vars.YOKI_DEPLOY_WITH_ACTIONS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage

  # 版を出す（元のリポジトリだけ。フォークでは動かさない）。feat・fix・perf などがあれば、次の版のタグと GitHub の Release を作る
  release:
    needs: check
    if: github.repository == (vars.YOKI_UPSTREAM || 'Xelltis/yoki')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 版を出す（semantic-release）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release

  deploy:
    needs: [check, release]
    # 版を出さなかった（フォーク・出す変更が無い）ときも公開する
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.YOKI_APP_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # 版は package.json から読む。版を出したばかりなら、版を書き換えたコミットが main の先にあるので、main の今を取る
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: 組み立てる（D1 の ID とリポジトリの名前を入れる。D1 の ID が無ければ止まる）
        run: npm run build
        env:
          YOKI_DEPLOY: '1'
          YOKI_D1_DATABASE_ID: ${{ vars.YOKI_D1_DATABASE_ID }}
          YOKI_REPOSITORY: ${{ github.repository }}
          YOKI_UPSTREAM: ${{ vars.YOKI_UPSTREAM }}

      # 表を変える前の地点（bookmark）を控える。更新で困ったら、wrangler d1 time-travel restore で戻す（docs/deployment.md の「新しい版に上げる」）
      - name: 表を変える前の地点を控える（D1 の Time Travel）
        run: |
          {
            echo '### 表を変える前の D1 の地点'
            echo '```'
            npx wrangler d1 time-travel info DB --config dist/yoki/wrangler.json 2>&1 || echo '控えられませんでした（公開は続けます）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 本番の D1 に表の変更を当てる
        run: npx wrangler d1 migrations apply DB --remote --config dist/yoki/wrangler.json

      # Worker の secret は、公開する版と一緒に送る（ファイルは runner の一時の場所に置き、送ったら消す）。
      # DiscordアプリのClient ID・公開のアドレス・GoogleのClient IDは秘密ではないが、var にすると Workers Builds で公開したときと
      # 置き場所が変わるので、ここでも secret にする
      - name: 公開する
        env:
          DISCORD_CLIENT_ID: ${{ vars.YOKI_DISCORD_CLIENT_ID }}
          APP_URL: ${{ vars.YOKI_APP_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.YOKI_GOOGLE_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          OPERATOR_IDS: ${{ secrets.OPERATOR_IDS }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_KEY: ${{ secrets.GOOGLE_TOKEN_KEY }}
          UPDATE_DISPATCH_TOKEN: ${{ secrets.UPDATE_DISPATCH_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::secret の CLOUDFLARE_API_TOKEN がありません'; exit 1; }
          test -n "$DISCORD_CLIENT_ID" || { echo '::error::変数の YOKI_DISCORD_CLIENT_ID がありません'; exit 1; }
          test -n "$DISCORD_CLIENT_SECRET" || { echo '::error::secret の DISCORD_CLIENT_SECRET がありません'; exit 1; }
          test -n "$DISCORD_BOT_TOKEN" || { echo '::error::secret の DISCORD_BOT_TOKEN がありません'; exit 1; }
          secrets="$RUNNER_TEMP/secrets.json"
          trap 'rm -f "$secrets"' EXIT
          node -e "
            const s = { DISCORD_CLIENT_ID: process.env.DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET: process.env.DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN: process.env.DISCORD_BOT_TOKEN };
            if (process.env.APP_URL) s.APP_URL = process.env.APP_URL;
            if (process.env.GOOGLE_CLIENT_ID) s.GOOGLE_CLIENT_ID = process.env.GOOGLE_CLIENT_ID;
            if (process.env.OPERATOR_IDS) s.OPERATOR_IDS = process.env.OPERATOR_IDS;
            if (process.env.GOOGLE_CLIENT_SECRET) s.GOOGLE_CLIENT_SECRET = process.env.GOOGLE_CLIENT_SECRET;
            if (process.env.GOOGLE_TOKEN_KEY) s.GOOGLE_TOKEN_KEY = process.env.GOOGLE_TOKEN_KEY;
            if (process.env.UPDATE_DISPATCH_TOKEN) s.UPDATE_DISPATCH_TOKEN = process.env.UPDATE_DISPATCH_TOKEN;
            require('fs').writeFileSync(process.argv[1], JSON.stringify(s), { mode: 0o600 });
          " "$secrets"
          npx wrangler deploy --config dist/yoki/wrangler.json --secrets-file "$secrets"
