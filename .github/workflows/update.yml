# 卓予定を新しい版に上げる（フォークして公開している卓予定で動かす。元のリポジトリでは何もしない）。
# 元のリポジトリ（vars の YOKI_UPSTREAM。無ければ Xelltis/yoki）の Release のタグを main に取り込み、公開のワークフロー（deploy.yml）を動かす。
# 表（D1）の変更は、公開のワークフローが、変える前の地点を控えてから当てる。
#   動かし方: 運営の管理画面の「更新」のボタン（Worker の secret に UPDATE_DISPATCH_TOKEN があるとき）か、この画面の「Run workflow」
#   取り込みでぶつかったら（フォークでコードを直しているときなど）: main は変えずに PR を作って止まる。GitHub の画面で直してマージする
#   元のリポジトリが .github/workflows/ を変えた版は、GITHUB_TOKEN では main に書き込めない。そのときは Actions の secret に
#   UPDATE_PUSH_TOKEN（このリポジトリの Contents と Workflows を書ける fine-grained token）を入れる（README の「新しい版に上げる」）
name: 卓予定を更新する

on:
  workflow_dispatch:
    inputs:
      version:
        description: 上げる版（例 1.2.0）。空なら最新の版
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write

# 更新は 1 つずつ
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPSTREAM: ${{ vars.YOKI_UPSTREAM || 'Xelltis/yoki' }}
      WANT: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      UPDATE_TOKEN: ${{ secrets.UPDATE_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.UPDATE_PUSH_TOKEN || github.token }}

      - name: 上げる版を決める
        id: ver
        run: |
          if [ "$GITHUB_REPOSITORY" = "$UPSTREAM" ]; then echo '::error::元のリポジトリでは動かしません（フォークして公開している卓予定で動かします）'; exit 1; fi
          tag="$WANT"
          if [ -z "$tag" ]; then tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName); fi
          tag="v${tag#v}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::版の形が違います: $tag"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 取り込む
        id: merge
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$TAG:refs/tags/$TAG"
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "すでに $TAG を取り込んでいます。" >> "$GITHUB_STEP_SUMMARY"
            echo 'pushed=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit -m "chore: 卓予定 $TAG を取り込む" "$TAG"; then
            git merge --abort
            branch="update/$TAG"
            git push --force origin "$TAG^{commit}:refs/heads/$branch"
            gh pr create --base main --head "$branch" --title "chore: 卓予定 $TAG を取り込む" \
              --body "元のリポジトリの $TAG を取り込もうとして、このリポジトリの変更とぶつかりました。ぶつかったところを直してマージすると、公開されます。" \
              || echo '::warning::PR を作れませんでした（Settings → Actions の「Allow GitHub Actions to create and approve pull requests」を入れるか、手で作ってください）'
            echo "::error::$TAG の取り込みでぶつかりました。$branch を PR にしたので、GitHub の画面で直してマージしてください"
            exit 1
          fi
          if ! git push origin HEAD:main; then
            echo '::error::main に書き込めませんでした。元のリポジトリがワークフローのファイル（.github/workflows/）を変えた版は、Actions の secret に UPDATE_PUSH_TOKEN が要ります（README の「新しい版に上げる」）'
            exit 1
          fi
          echo "$TAG を取り込みました。公開は「アプリを公開する」のワークフローで進みます。" >> "$GITHUB_STEP_SUMMARY"
          echo 'pushed=yes' >> "$GITHUB_OUTPUT"

      # UPDATE_PUSH_TOKEN で書き込んだときは、push で公開のワークフローが動く。GITHUB_TOKEN のときは動かないので、ここで動かす
      - name: 公開する
        if: steps.merge.outputs.pushed == 'yes' && env.UPDATE_TOKEN == ''
        run: gh workflow run deploy.yml --ref main
