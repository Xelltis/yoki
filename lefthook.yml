# Git のフック（lefthook）。npm install のときに入る。入っていなければ npx lefthook install
# 一度だけ止めたいときは LEFTHOOK=0 git commit …
# 書き方: https://lefthook.dev/configuration/

# コミットの前: 型の確認・lint・テスト。関係するファイル（依存を変えたときの package-lock.json も）をコミットするときだけ回す
pre-commit:
  parallel: true
  jobs:
    - name: 型の確認
      glob:
        - "*.ts"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.vue"
        - "**/tsconfig*.json"
        - "package-lock.json"
      run: npm run typecheck

    - name: lint
      glob:
        - "*.{ts,tsx,js}"
        - "**/*.{ts,tsx,js}"
        - ".oxlintrc.json"
      run: npm run lint

    - name: テスト
      glob:
        - "src/**"
        - "test/**"
        - "migrations/**"
        - "website/**"
        - "*.config.ts"
        - "wrangler.jsonc"
        - "package-lock.json"
      run: npm test

# コミットの説明: Conventional Commits の形か（commitlint。決まりは commitlint.config.js と CLAUDE.md の「コミット」）。
# Git が作る説明（Merge・Revert・fixup! など）は commitlint がそのまま通す
commit-msg:
  jobs:
    - name: commitlint
      run: npx --no -- commitlint --edit "{1}"
